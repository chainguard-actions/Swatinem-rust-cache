name: Test rust-cache registry-only caching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Rust project
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-project/src"
          cat > "$GITHUB_WORKSPACE/test-project/Cargo.toml" << 'EOF'
          [package]
          name = "test-project"
          version = "0.1.0"
          edition = "2021"
          EOF
          cat > "$GITHUB_WORKSPACE/test-project/src/main.rs" << 'EOF'
          fn main() {}
          EOF

      - id: rust-cache
        uses: .
        with:
          workspaces: test-project
          cache-targets: "false"
          cache-all-crates: "true"
        continue-on-error: true

      - name: Assert action ran in registry-only mode
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          OUTCOME: ${{ steps.rust-cache.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in registry-only mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
