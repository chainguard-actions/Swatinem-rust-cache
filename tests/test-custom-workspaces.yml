name: Test rust-cache with custom workspaces and cache-directories
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal Cargo workspace for testing
        run: |
          mkdir -p /tmp/test-workspace/src
          cat > /tmp/test-workspace/Cargo.toml << 'EOF'
          [package]
          name = "test-crate"
          version = "0.1.0"
          edition = "2021"
          EOF
          echo 'fn main() {}' > /tmp/test-workspace/src/main.rs

      - id: action
        uses: .
        continue-on-error: true
        with:
          workspaces: "/tmp/test-workspace -> target"
          cache-directories: "/tmp/test-workspace/target"
          add-rust-environment-hash-key: "false"

      - name: Assert action ran with custom workspaces
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "cache-hit: $CACHE_HIT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
              echo "FAIL: expected cache-hit to be 'true' or 'false', got: '$CACHE_HIT'"
              exit 1
            fi
            echo "PASS: custom workspaces mode succeeded, cache-hit=$CACHE_HIT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under sentinel repo / no Rust toolchain)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
