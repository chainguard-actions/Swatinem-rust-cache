name: Test env-vars input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          env-vars: "MY_CUSTOM_VAR ANOTHER_VAR"
          save-if: "false"
        env:
          MY_CUSTOM_VAR: "test-value-123"
          ANOTHER_VAR: "another-value-456"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # cache-hit should be either 'true' or 'false' (or empty on miss)
          # The important thing is the action ran without error
          echo "PASS: action completed with env-vars input"
