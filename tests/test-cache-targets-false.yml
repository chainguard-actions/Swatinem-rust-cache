name: Test cache-targets false (registry only)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          cache-targets: "false"
          prefix-key: "v0-rust-registry-only"
      - name: Assert cache-hit output is set
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: expected cache-hit to be 'true' or 'false', got: '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit=$CACHE_HIT"
