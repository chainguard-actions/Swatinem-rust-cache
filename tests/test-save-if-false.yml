name: Test save-if false (restore-only mode)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          save-if: "false"
      - name: Assert action completed in restore-only mode
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          # With save-if=false, the action only restores (never saves).
          # The action should still complete and emit cache-hit.
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ] || [ -z "$CACHE_HIT" ]; then
            echo "PASS: restore-only mode completed with cache-hit='$CACHE_HIT'"
          else
            echo "FAIL: unexpected cache-hit value: '$CACHE_HIT'"
            exit 1
          fi
